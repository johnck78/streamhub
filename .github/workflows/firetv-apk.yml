name: Build StreamHub Fire TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'firetv/**'
      - '.github/workflows/firetv-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android TV debug APK
        run: gradle --no-daemon --stacktrace -p firetv assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-FireTV-debug-APK
          path: firetv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
